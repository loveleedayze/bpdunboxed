backend:
  name: github
  repo: loveleedayze/bpdunboxed
  branch: main
  # Must be the exact production domain this site is deployed to (same value
  # you use for CLIENT_URL). It has to match the GitHub OAuth App's
  # "Authorization callback URL" (<base_url>/api/callback) exactly.
  base_url: https://REPLACE_WITH_YOUR_DOMAIN
  auth_endpoint: api/auth

# Uploaded images are committed to the repo here...
media_folder: "content/blog/uploads"
# ...and served publicly from this path once the site is built.
public_folder: "/blog/uploads"

publish_mode: simple

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Shown on the blog listing page." }
      - { label: "Body", name: "body", widget: "markdown" }
